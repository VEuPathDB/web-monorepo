# NOTE: All workflows (including pr-check.yml) now cache dependencies automatically via
# actions/setup-node's built-in package-manager caching. But GitHub Actions cache access is
# one-directional: a branch or tag can fall back to a cache created on the default branch, but
# the default branch can never read a cache created elsewhere (and different tags can't share
# caches with each other at all). See
# https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#restrictions-for-accessing-a-cache
#
# So this workflow is the *only* thing that ever populates a main-scoped cache - without it,
# every PR would start fully cold instead of falling back to main's cache.

name: Generate caches
on:
  push:
    branches:
      - main
    paths:
      - yarn.lock
jobs:
  # Cache yarn install command
  # actions/setup-node caches automatically based on the packageManager field in package.json
  cache-yarn:
    name: Generate yarn cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: '24.11.0'
      - run: yarn

